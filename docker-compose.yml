# Three independent MySQL 8.4 databases for the default config
# (etc/taskgame.yaml). Each instance runs the SAME full schema and owns about
# 1/3 of the data. There is no primary database.
#
#   docker compose up -d
#   CGO_ENABLED=0 go run .
#
# Ports are 3307/3308/3309 on purpose, so an existing local MySQL on 3306 is
# left untouched. To put the cells on different machines, change only the
# three DSNs in etc/taskgame.yaml.
services:
  db-cell-0:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: taskgame
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-cell-1:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: taskgame
    ports:
      - "3308:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-cell-2:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: taskgame
    ports:
      - "3309:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20
