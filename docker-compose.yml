# Local MySQL 8 for Store.Driver mysql. The API is not started here.
#   docker compose up -d
#   go run . -f etc/taskgame.mysql.yaml
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: taskgame
      MYSQL_DATABASE: taskgame
      MYSQL_USER: taskgame
      MYSQL_PASSWORD: taskgame
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptaskgame"]
      interval: 5s
      timeout: 5s
      retries: 20
