# P1+ multi-database skeleton (opt-in, off by default).
#
# Enabling Scale does NOT move any table and does NOT change any API response:
# it only constructs the contracts and their runnable in-process replacements.
# See README.md "P1+ 多数据库骨架" and internal/scale.TODOs for the boundary.
#
#   CGO_ENABLED=0 go run . -f etc/taskgame.scale-skeleton.yaml
Name: taskgame-api
Host: 0.0.0.0
Port: 8891
Mode: dev
Timeout: 10000
CpuThreshold: 0
Log:
  Mode: console
  Encoding: plain
  Level: info
  Stat: false

Auth:
  JwtSecret: dev-jwt-secret-change-me-32b
  TokenTTL: 24h
  ApiKeys:
    - Key: dev-publisher-key
      UserId: usr_publisher
    - Key: dev-executor-key
      UserId: usr_executor
    - Key: dev-arbiter-key
      UserId: usr_arbiter

Store:
  Driver: sqlite
  DSN: "file:data/taskgame.db?mode=rwc&_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)&_txlock=immediate"

# Everything below is scaffolding. Message sharding still comes from
# Store.Shards / Store.ShardDSNs; the User and Task counts are placeholders.
Scale:
  Enabled: true
  # shared uses notify.MemoryTransport: it emulates several API processes
  # inside ONE process for tests. For real cross-process signals use
  # PubSub: redis (see etc/taskgame.scale-redis.yaml).
  PubSub: shared
  InstanceID: api-a
  # P2 #3: persist the routing directory + shard topology in SQL instead of
  # keeping it in process memory. Driver/DSN default to Store.Driver/Store.DSN
  # (the primary doubles as the tiny control plane: only 3 small tables are
  # added). A separate file is used here so the two pools do not contend.
  # Multi-machine: set Driver: mysql and a DSN every API process can reach.
  Directory:
    Enabled: true
    Driver: sqlite
    DSN: "file:data/control-plane.db?mode=rwc&_pragma=busy_timeout(5000)"
  Domains:
    UserShards: 4
    TaskShards: 2
  Archive:
    Enabled: true
    Dir: "data/blobs"
    HotWindow: 2160h
  Search:
    Enabled: true
    Driver: memory
  # P1 #2: shared-lease outbox projection. PubSub=shared uses the in-process
  # lease/bus (single-node demo); taskgame.scale-redis.yaml uses real Redis.
  Projection:
    Enabled: true
    Interval: 5s
    LeaseTTL: 30s

Escrow:
  InitialBalance: 1000000
  Currency: credits
  ArbiterUserIds:
    - usr_arbiter

Webhook:
  Mode: log
  Interval: 2s
  Timeout: 5s
  MaxAttempts: 3

AutoSettle:
  Enabled: true
  Interval: 30s
  OpenTimeout: 72h
  StartTimeout: 72h
  SeatTimeout: 72h
  WinnerSelectHours: 72
