# MySQL primary + one network MySQL database per message shard.
# Start the databases first (a fresh compose volume runs etc/mysql-init.d):
#   docker compose up -d
#   CGO_ENABLED=0 go run . -f etc/taskgame.mysql-shards.yaml
Name: taskgame-api
Host: 0.0.0.0
Port: 8891
Mode: dev
Timeout: 10000
CpuThreshold: 0
Log:
  Mode: console
  Encoding: plain
  Level: info
  Stat: false

Auth:
  JwtSecret: dev-jwt-secret-change-me-32b
  TokenTTL: 24h
  ApiKeys:
    - Key: dev-publisher-key
      UserId: usr_publisher
    - Key: dev-executor-key
      UserId: usr_executor
    - Key: dev-arbiter-key
      UserId: usr_arbiter

Store:
  Driver: mysql
  DSN: "root:123456@tcp(127.0.0.1:3306)/taskgame?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false"
  Shards: 2
  ShardDriver: mysql
  # One DSN per shard, in shard order. These may point at different hosts:
  # every API process reaches the same set of shard databases over the network.
  ShardDSNs:
    - "root:123456@tcp(127.0.0.1:3306)/taskgame_shard_0?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false"
    - "root:123456@tcp(127.0.0.1:3306)/taskgame_shard_1?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false"

Escrow:
  InitialBalance: 1000000
  Currency: credits
  ArbiterUserIds:
    - usr_arbiter

Webhook:
  Mode: log
  Interval: 2s
  Timeout: 5s
  MaxAttempts: 3

AutoSettle:
  Enabled: true
  Interval: 30s
  OpenTimeout: 72h
  StartTimeout: 72h
  SeatTimeout: 72h
  WinnerSelectHours: 72
