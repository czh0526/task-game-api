# P1+ skeleton with a REAL cross-process signal bus (Redis pub/sub).
#
# Unlike taskgame.scale-skeleton.yaml (PubSub: shared, in-process only), this
# config makes two or more API processes exchange SSE signals over Redis.
# Start Redis first:
#
#   docker run --rm -p 6379:6379 --name taskgame-redis redis:7-alpine
#   CGO_ENABLED=0 go run . -f etc/taskgame.scale-redis.yaml
#
# For a second API process: copy this file, change Port (e.g. 8892) and
# Scale.InstanceID (e.g. api-b), and KEEP the same Scale.Redis.Addr + Channel.
# Both processes subscribe independently; Redis broadcasts every signal to all
# of them. Redis pub/sub is at-most-once: a signal sent while a process is down
# is lost, but signals carry ids only and the browser's 45s fallback poll
# repairs the gap.
#
# NOTE: Store is still local SQLite here, so this example demonstrates the SSE
# bus only. A real multi-instance deployment must ALSO point Store at the
# shared MySQL primary (see etc/taskgame.mysql-shards.yaml).
Name: taskgame-api
Host: 0.0.0.0
Port: 8891
Mode: dev
Timeout: 10000
CpuThreshold: 0
Log:
  Mode: console
  Encoding: plain
  Level: info
  Stat: false

Auth:
  JwtSecret: dev-jwt-secret-change-me-32b
  TokenTTL: 24h
  ApiKeys:
    - Key: dev-publisher-key
      UserId: usr_publisher
    - Key: dev-executor-key
      UserId: usr_executor
    - Key: dev-arbiter-key
      UserId: usr_arbiter

Store:
  Driver: sqlite
  DSN: "file:data/taskgame.db?mode=rwc&_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)&_txlock=immediate"

Scale:
  Enabled: true
  # local  = single process, no bus (PR #38 behaviour)
  # shared = in-process bus for tests only
  # redis  = real cross-process Redis pub/sub
  PubSub: redis
  InstanceID: api-a
  Redis:
    Addr: "127.0.0.1:6379"
    Channel: "taskgame.signals"
    Timeout: 2s
    # Username / Password / DB are optional.
  Domains:
    UserShards: 4
    TaskShards: 2
  Archive:
    Enabled: true
    Dir: "data/blobs"
    HotWindow: 2160h
  Search:
    Enabled: true
    Driver: memory
  # P1 #2: Redis-backed shared lease + wake-up bus for outbox projection.
  Projection:
    Enabled: true
    Interval: 5s
    LeaseTTL: 30s
    Channel: "taskgame.outbox"

Escrow:
  InitialBalance: 1000000
  Currency: credits
  ArbiterUserIds:
    - usr_arbiter

Webhook:
  Mode: log
  Interval: 2s
  Timeout: 5s
  MaxAttempts: 3

AutoSettle:
  Enabled: true
  Interval: 30s
  OpenTimeout: 72h
  StartTimeout: 72h
  SeatTimeout: 72h
  WinnerSelectHours: 72
