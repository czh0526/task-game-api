# Default config: horizontal cell sharding (plan A).
#
# Three INDEPENDENT MySQL databases, each on its own instance/port, run the
# SAME full schema. Every cell owns roughly 1/3 of users, tasks, messages and
# all other business tables. There is NO primary database holding every row:
#
#   3307/taskgame  cell 0: ~1/3 of users + their tasks, chats, messages, ledger...
#   3308/taskgame  cell 1: ~1/3 of users + their tasks, chats, messages, ledger...
#   3309/taskgame  cell 2: ~1/3 of users + their tasks, chats, messages, ledger...
#
# A request is routed by the authenticated user id (or by the task/chat id in
# the URL) to exactly one cell, and its transaction stays inside that cell.
# No 2PC. Global reads (market listing, login by email) fan out and merge.
#
# Start the three databases and Redis first (compose starts all four):
#   docker compose up -d
#   CGO_ENABLED=0 go run .            # this file is loaded by default
#
# Redis is REQUIRED by this config: Scale.PubSub=redis publishes SSE signals
# on a shared channel and PINGs Redis at startup, so `make run` fails fast
# when 6379 is unreachable. Redis carries signals only, never business rows.
#
# To run all three cells on ONE MySQL server instead, keep the same port and
# give each DSN a different schema name (for example taskgame_cell_0/1/2).
# Adding or removing a cell means editing the ordered Cells list; see the
# "Resizing the cells" section of the README (it is a data migration).
Name: taskgame-api
Host: 0.0.0.0
Port: 8891
Mode: dev
Timeout: 10000
CpuThreshold: 0
Log:
  Mode: console
  Encoding: plain
  Level: info
  Stat: false

# HS256 bearer tokens and static API keys. Sample keys are for local development.
Auth:
  JwtSecret: dev-jwt-secret-change-me-32b
  # Lifetime of POST /v1/register and POST /v1/login tokens. Same claims as `make token`.
  TokenTTL: 24h
  ApiKeys:
    - Key: dev-publisher-key
      UserId: usr_publisher
    - Key: dev-executor-key
      UserId: usr_executor
    - Key: dev-arbiter-key
      UserId: usr_arbiter

Store:
  Driver: mysql
  # P2 per-domain routing is OFF by default. Set Mode: domain to route each
  # aggregate-root family through its own DSN list. Domains without explicit
  # Scale.Domains.<Name>.DSNs inherit Cells below, so a staged rollout starts
  # with all data still co-located; only change one domain's DSNs at a time.
  # Mode: domain
  # One DSN per cell, in cell order. Every API process must use the same
  # ordered list. No DSN / Shards setting is used when Cells is present.
  Cells:
    - "root:123456@tcp(127.0.0.1:3307)/taskgame?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false"
    - "root:123456@tcp(127.0.0.1:3308)/taskgame?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false"
    - "root:123456@tcp(127.0.0.1:3309)/taskgame?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false"

# Simulated credits. InitialBalance is granted the first time a user is seen.
# ArbiterUserIds may POST /v1/tasks/{taskId}/arbitrate. They are not the publisher or the executor.
# Dev arbiter: X-Api-Key dev-arbiter-key, or `make token USER_ID=usr_arbiter`.
Escrow:
  InitialBalance: 1000000
  Currency: credits
  ArbiterUserIds:
    - usr_arbiter

# log: record X-Signature and do not POST. post: deliver the queued body.
Webhook:
  Mode: log
  Interval: 2s
  Timeout: 5s
  MaxAttempts: 3

# Review auto-settle, plus recruiting / start / seat / winner-select timeouts.
# Exclusive (and a competitive task with exactly one submission) settles at review_deadline.
# Competitive with more than one submission does not guess a winner. winner_select_deadline
# is review_deadline + WinnerSelectHours; if the publisher still has not confirmed, the pool is refunded.
# OpenTimeout: exclusive, competitive with zero accepts, and unified collaborative tasks that are still open.
# StartTimeout: unified collaborative, measured from the moment the last seat is filled.
# SeatTimeout: per_seat seats that are still open, measured from fund or from the dropout that reopened the seat.
AutoSettle:
  Enabled: true
  Interval: 30s
  OpenTimeout: 72h
  StartTimeout: 72h
  SeatTimeout: 72h
  WinnerSelectHours: 72

# Cross-process SSE signal bus. Every API process in one deployment must use
# the same Redis Addr and Channel. Leave InstanceID empty: each process then
# generates a unique id at startup, so copying this file for a second API
# process only needs a different Port. A fixed InstanceID is still accepted,
# but MUST be unique (never reuse the same value in two processes), otherwise
# the echo filter drops the other process's signals.
# The other Scale sub-systems (Projection / Directory / Domains / Archive /
# Search) stay disabled: they belong to the legacy message-sharding prototype.
Scale:
  Enabled: true
  PubSub: redis
  # InstanceID: api-a   # optional; empty = auto-generated unique id per process
  Redis:
    Addr: "127.0.0.1:6379"
    Channel: "taskgame.signals"
    Timeout: 2s
  # Per-domain physical placement, consumed only when Store.Mode=domain.
  # Every domain may be cut over independently: omit a domain to keep it on
  # Store.Cells. Keep DSN order identical on every API process.
  # Domains:
  #   User:
  #     Shards: 3
  #     DSNs:
  #       - "root:123456@tcp(127.0.0.1:3307)/taskgame?..."
  #       - "root:123456@tcp(127.0.0.1:3308)/taskgame?..."
  #       - "root:123456@tcp(127.0.0.1:3309)/taskgame?..."
  #   Task:
  #     Shards: 3
  #     DSNs: [...]   # same three DSNs while co-located
  #   Message:
  #     Shards: 3
  #     DSNs: [...]   # change to dedicated message DSNs to cut this domain over
  # Directory HA: optional read replica. Writes always go to Directory.DSN;
  # Lookup reads use the replica with automatic fallback to the primary.
  # Directory:
  #   Enabled: true
  #   Driver: mysql
  #   DSN: "root:123456@tcp(127.0.0.1:3307)/taskgame_control?..."
  #   ReplicaDSN: "root:123456@tcp(127.0.0.1:3311)/taskgame_control?..."
  # Cross-domain saga reconciler (opt-in; requires Directory.Enabled for the log DB).
  # Enable it before physically splitting user and task domains so a crash
  # between the balance deduction and escrow insert can be replayed/compensated.
  # Compensation:
  #   Enabled: true
  #   Interval: 5s
  #   LeaseTTL: 30s
  #   MaxRetry: 5
