# Default config: MySQL with message sharding enabled.
#
# One MySQL server holds three separate databases. Each database owns a
# different part of the data, so no single database carries all the rows or
# all the writes:
#
#   taskgame          primary: users, tasks, ledger, friends, chats, webhooks
#   taskgame_shard_0  about half of the chat messages (by chat id)
#   taskgame_shard_1  the other half
#
# Start the databases first (a fresh compose volume creates the shard
# databases from etc/mysql-init.d):
#   docker compose up -d
#   CGO_ENABLED=0 go run .            # this file is loaded by default
#
# To put each shard on its own MySQL machine, change only the ShardDSNs
# entries below (for example 3308 / 3309). The primary DSN stays as it is.
# Adding a shard means appending one more DSN and raising Shards; existing
# rows keep their assignment, so no data has to be moved.
Name: taskgame-api
Host: 0.0.0.0
Port: 8891
Mode: dev
Timeout: 10000
CpuThreshold: 0
Log:
  Mode: console
  Encoding: plain
  Level: info
  Stat: false

# HS256 bearer tokens and static API keys. Sample keys are for local development.
Auth:
  JwtSecret: dev-jwt-secret-change-me-32b
  # Lifetime of POST /v1/register and POST /v1/login tokens. Same claims as `make token`.
  TokenTTL: 24h
  ApiKeys:
    - Key: dev-publisher-key
      UserId: usr_publisher
    - Key: dev-executor-key
      UserId: usr_executor
    - Key: dev-arbiter-key
      UserId: usr_arbiter

Store:
  Driver: mysql
  # Primary database. Holds everything except message bodies.
  DSN: "root:123456@tcp(127.0.0.1:3306)/taskgame?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false"
  # Message bodies are split across these databases by chat id. One DSN per
  # shard, in shard order; every API process must use the same list.
  Shards: 2
  ShardDriver: mysql
  ShardDSNs:
    - "root:123456@tcp(127.0.0.1:3306)/taskgame_shard_0?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false"
    - "root:123456@tcp(127.0.0.1:3306)/taskgame_shard_1?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false"

# Simulated credits. InitialBalance is granted the first time a user is seen.
# ArbiterUserIds may POST /v1/tasks/{taskId}/arbitrate. They are not the publisher or the executor.
# Dev arbiter: X-Api-Key dev-arbiter-key, or `make token USER_ID=usr_arbiter`.
Escrow:
  InitialBalance: 1000000
  Currency: credits
  ArbiterUserIds:
    - usr_arbiter

# log: record X-Signature and do not POST. post: deliver the queued body.
Webhook:
  Mode: log
  Interval: 2s
  Timeout: 5s
  MaxAttempts: 3

# Review auto-settle, plus recruiting / start / seat / winner-select timeouts.
# Exclusive (and a competitive task with exactly one submission) settles at review_deadline.
# Competitive with more than one submission does not guess a winner. winner_select_deadline
# is review_deadline + WinnerSelectHours; if the publisher still has not confirmed, the pool is refunded.
# OpenTimeout: exclusive, competitive with zero accepts, and unified collaborative tasks that are still open.
# StartTimeout: unified collaborative, measured from the moment the last seat is filled.
# SeatTimeout: per_seat seats that are still open, measured from fund or from the dropout that reopened the seat.
AutoSettle:
  Enabled: true
  Interval: 30s
  OpenTimeout: 72h
  StartTimeout: 72h
  SeatTimeout: 72h
  WinnerSelectHours: 72
