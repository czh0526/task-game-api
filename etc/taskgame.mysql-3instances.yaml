# One MySQL instance per logical database. Start all three first:
#   docker compose -f docker-compose.3instances.yml -p taskgame-3inst up -d
# Every API process uses this same file (only Port differs between processes),
# so all of them reach the same three instances.
Name: taskgame-api
Host: 0.0.0.0
Port: 8891
Mode: dev
Timeout: 10000
CpuThreshold: 0
Log:
  Mode: console
  Encoding: plain
  Level: info
  Stat: false

Auth:
  JwtSecret: dev-jwt-secret-change-me-32b
  TokenTTL: 24h
  ApiKeys:
    - Key: dev-publisher-key
      UserId: usr_publisher
    - Key: dev-executor-key
      UserId: usr_executor
    - Key: dev-arbiter-key
      UserId: usr_arbiter

Store:
  Driver: mysql
  # Instance 1: the primary schema (users, chats, chat_shards directory,
  # message_outbox, webhooks, ledger).
  DSN: "root:123456@tcp(127.0.0.1:3307)/taskgame?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false"
  Shards: 2
  ShardDriver: mysql
  # Instance 2 and 3: one messages table each. The list is ordered by shard
  # index and must be identical in every API process.
  ShardDSNs:
    - "root:123456@tcp(127.0.0.1:3308)/taskgame_shard_0?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false"
    - "root:123456@tcp(127.0.0.1:3309)/taskgame_shard_1?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false"

Escrow:
  InitialBalance: 1000000
  Currency: credits
  ArbiterUserIds:
    - usr_arbiter

Webhook:
  Mode: log
  Interval: 2s
  Timeout: 5s
  MaxAttempts: 3

AutoSettle:
  Enabled: true
  Interval: 30s
  OpenTimeout: 72h
  StartTimeout: 72h
  SeatTimeout: 72h
  WinnerSelectHours: 72
