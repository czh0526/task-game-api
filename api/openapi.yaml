openapi: 3.1.0
info:
  title: Task Game Open Protocol
  version: 0.1.0
  summary: Multiplayer shared-task marketplace API (simulated escrow first)
  description: |
    Locked assumptions (v0.1):
    - Simulated escrow (credits); real money later without changing task FSM
    - Acceptance: executor submit → publisher confirm; default 72h auto-settle; dispute freezes funds
    - Task kinds: exclusive | competitive | collaborative
    - competitive.settlement_rule = winner_take_all
    - collaborative.on_dropout = replace (dropout gets 0 commission, 0 ability score)
    - Additive in v0.1: collaborative roles take optional quantity (default 1). share_bps is the template total and those totals still sum to 10000. The server materializes that many seats and splits the share (extra basis points go to the last seats of that template). Task responses list seats, not templates. Accept uses the seat id. A flat roles[] array with no quantity is unchanged.
    - collaborative.settlement_mode = per_seat | unified, default unified. Omitting the field means unified, including tasks stored before the field existed. Collaborative tasks use payment.mode one_shot in v0.1 so seat shares apply to one escrow pool.
      unified: executors may fill seats while the task is open. Work does not start, and status does not become active, until the publisher calls POST /tasks/{taskId}/start and every seat is filled. Confirm is all-or-nothing: it fails until every current seat has submitted and no seat is open, then one settlement splits the whole pool by seat share_bps. After start, dropout replace still reopens that seat and the task stays active. Confirm stays blocked until the seat is filled again and every current seat has submitted.
      per_seat: each executor accepts an open seat after fund. That seat can submit and be confirmed on its own. POST /tasks/{taskId}/confirm with role_id releases only that seat's share_bps of the original pool (escrow.release) and leaves the rest held. An open seat is not paid; confirming it refunds that share to the publisher. The task is settled only when every seat is settled or refunded. v0.1 auto-settle for per_seat runs only after every non-terminal seat has submitted and the review window has passed. Confirm earlier seats manually. Ability and commission for an executor apply when that seat is paid; unified still applies them in one batch on confirm.
    - API / Webhook first; no UI required for third parties
    - Additive in v0.1: POST /register and POST /login are public. They store a bcrypt password hash (never plaintext) and return an HS256 access token with the same claims as `make token` (`sub` is the user id, plus `iat` and `exp`). X-Api-Key dev users such as usr_publisher and usr_executor stay valid. GET /me returns the caller id, email, and is_arbiter.
    - Additive in v0.1, workflow closure: POST /tasks/{taskId}/cancel, /revise, /resolve, and /arbitrate. Cancel refunds held funds when work has not been submitted. A per_seat task with submissions cancels only unfinished seats (open or filled, not submitted). Revise marks a submission superseded and returns the seat or task to active, up to acceptance.max_revisions (default 3). Dispute still freezes. Mutual resolve needs both sides to post the same outcome. Arbitrate applies immediately and only for Escrow.ArbiterUserIds. A full refund closes the task as cancelled. A payout closes it as settled. Per-seat disputes freeze only that seat's share; other seats keep their own confirm and refund rules. A single competitive submission still auto-settles at review_deadline (winner_take_all does not guess among multiple submissions). After that, winner_select_deadline refunds the pool if no winner was chosen.
    - Additive in v0.1, visibility: task responses include submissions[] (current and superseded). Funding a task creates one chat (chat_id) with the publisher; accept adds the executor. GET /chats/{chatId}, GET /chats/{chatId}/messages (oldest first within a page), and GET /chats?task_id= read that thread. Dropout does not remove chat members. Chat.type is task, direct, or group.
    - Additive in v0.1, direct chats: POST /chats {type: direct, user_id} opens one 1:1 thread per friend pair. The two users must already be friends (a pending request is not enough). The first call inserts the row and emits chat.created. A later call from either friend returns that same chat and does not insert another row. Both responses are 201. Unfriend does not remove members: GET and POST messages stay allowed. Opening the chat again requires friendship, and then returns the original id. type=group (or omitting type) with member_ids keeps the free-form chat, which inserts a new row every call. Task chats stay type=task and are not reused as direct chats.
    - Additive in v0.1, timeouts (default 72h, same ticker as auto-settle): open_timeout cancels an exclusive, an unaccepted competitive task, or a unified collaborative task that still has an open seat, at min(fund+OpenTimeout, acceptance.deadline). A unified task whose seats are all filled sets start_deadline and cancels with start_timeout if the publisher does not start. Per-seat open seats refund that share at min(opened_at+SeatTimeout, acceptance.deadline); filled and submitted seats are not auto-refunded. Competitive tasks with more than one current submission set winner_select_deadline = review_deadline + WinnerSelectHours and then refund with winner_select_timeout. Accepted work with no current submission cancels at acceptance.deadline (reason open_timeout). Executors on those refunds get 0 commission and 0 ability.
    - Additive in v0.1, assignee_policy is enforced on accept. specific allows user_ids or a pending/accepted invite, and a declined invite blocks until a new invite. criteria requires ability >= min_ability. The publisher cannot accept their own task. Funding a specific task invites each user_id (task.invited). GET /tasks?assignable=me lists tasks the caller can accept now. Friendship does not add an assignee_policy value and does not change who can accept a task.
    - Additive in v0.1, mutual friends and personal groups. POST /friends/requests {user_id} asks an existing user. You cannot friend yourself. Already friends, or a pending request you already sent, is 409 and does not insert a second row. If the other user already has a pending request toward you, that call accepts the existing request (200, status accepted) instead of opening another one. The recipient can accept or decline. The requester can cancel a pending outgoing request; cancel does not emit a webhook. Either friend can unfriend, which ends the relationship for both sides and clears both users' group membership for that pair. A later request is allowed. GET /friends is only the caller's list: groups are personal folders (a friend is in at most one of the owner's groups, or ungrouped). Deleting a group does not unfriend. Caps: 50 groups per user, 500 friends per user, 100 pending outgoing requests, group names 1–32 characters after trim and unique per owner, sort_order from -1000000 to 1000000. Friend objects expose user_id, integrity, ability, and since — the same public scores as GET /users/{userId}/scores — and never email, balance, or password. Webhook events friend.requested, friend.accepted, friend.declined, and friend.removed are delivered to the other party's existing webhook subscriptions (owner-scoped, same HMAC delivery as score.updated). They are not task-scoped.
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: Auth
  - name: Tasks
  - name: Escrow
  - name: Webhooks
  - name: Chats
  - name: Users
  - name: Friends
paths:
  /register:
    post:
      tags: [Auth]
      summary: Register with email and password
      operationId: register
      security: []
      description: |
        Public. Creates a user id (`usr_` plus random) and stores a bcrypt password hash.
        The access token is an HS256 JWT whose `sub` is that user id (same shape as `make token`).
        Invalid email or password is 400 `invalid_argument`. A duplicate email is 409 `conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordCredentials'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: login
      security: []
      description: |
        Public. Returns a new HS256 access token (`sub` is the user id).
        Unknown email and wrong password are both 401 `unauthorized` with the same message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordCredentials'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unknown email or wrong password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me:
    get:
      tags: [Auth, Users]
      summary: Current caller
      operationId: me
      description: |
        Requires Bearer or X-Api-Key. Email is empty when the caller has no password account
        (development API keys). is_arbiter is true when the caller is listed in Escrow.ArbiterUserIds.
      responses:
        '200':
          description: Caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks:
    get:
      tags: [Tasks]
      summary: List / filter tasks
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/TaskKind'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: assignable
          in: query
          schema: { type: string, enum: [me] }
          description: |
            When `me`, return tasks the caller can accept right now.
            The default list is unchanged when the parameter is omitted.
      responses:
        '200':
          description: Task page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
    post:
      tags: [Tasks]
      summary: Create task (draft)
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get task
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}/fund:
    post:
      tags: [Tasks, Escrow]
      summary: Simulate escrow hold → status open
      operationId: fundTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Funded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}/accept:
    post:
      tags: [Tasks]
      summary: Executor accepts an open task or an open collaborative seat
      operationId: acceptTask
      description: |
        Exclusive moves open to active. Competitive fills a slot and is active once the first executor accepts.
        Collaborative unified fills one seat and leaves the task open until POST /tasks/{taskId}/start.
        After that start, accept only fills a seat reopened by dropout, and the task stays active.
        Collaborative per_seat fills one seat. The first filled seat moves the task to active so that seat can submit without the others.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role_id:
                  type: string
                  description: |
                    Required for a collaborative task. This is a materialized seat id.
                    quantity 1 keeps the template id. quantity N uses `{id}_1` through `{id}_N`.
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}/start:
    post:
      tags: [Tasks]
      summary: Start a unified collaborative task once every seat is filled
      operationId: startTask
      description: |
        Publisher only. Valid when collaborative.settlement_mode is unified, including tasks created without the field.
        Status must be open, and every materialized seat must be filled.
        The task then becomes active. Executors cannot submit before this call.
        per_seat tasks do not use start. A filled seat submits while the task is active.
        Emits task.started. Subscribers opt in by listing that event.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '403':
          description: Caller is not the publisher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Not a unified open task, or a seat is still open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/{taskId}/submit:
    post:
      tags: [Tasks]
      summary: Submit delivery → in_review
      operationId: submitTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}/confirm:
    post:
      tags: [Tasks, Escrow]
      summary: Publisher confirms delivery and releases escrow
      operationId: confirmTask
      description: |
        Exclusive and competitive tasks must be in_review. Competitive winner_take_all pays the submission_id you choose.
        Milestone mode releases one milestone and returns the task to active until the last milestone.

        Collaborative unified (the default): confirm fails until the publisher has started the task, every seat is filled, and every filled seat has submitted.
        One confirm then splits the whole pool by seat share_bps. After start, dropout replace reopens that seat and the task stays active.
        Confirm keeps failing until that seat is filled and every current seat has submitted.
        The failure names the open seats (`unified settlement requires every seat to be filled; open: ...`) or the seats that have not submitted (`unified settlement requires a submission from every filled seat; missing: ...`).

        Collaborative per_seat: confirm one seat. role_id is that seat id.
        A submitted seat releases that seat's share of the original escrow pool to its executor and leaves the rest held.
        An open seat refunds that share to the publisher and pays nobody. A filled seat that has not submitted is rejected (`seat has not submitted`).
        Omit role_id only when exactly one seat is awaiting confirmation, or when every remaining seat is open (those shares are refunded together).
        When more than one seat is awaiting confirmation the error is `role_id is required when multiple seats are awaiting confirmation: ...`.
        The task stays active while any seat is still open or filled. It becomes settled only when every seat is settled or refunded.
        v0.1 does not auto-settle a per_seat task until every non-terminal seat has submitted and review_deadline has passed. Confirm earlier seats manually.
        role_id is rejected unless settlement_mode is per_seat.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                submission_id:
                  type: string
                  description: Required for competitive when more than one submission exists. Optional on per_seat; it must match that seat's submission.
                milestone_id:
                  type: string
                role_id:
                  type: string
                  description: |
                    Seat id. Used when settlement_mode is per_seat.
                    Confirms that one submitted seat, or refunds that one open seat.
      responses:
        '200':
          description: Settled, one seat released or refunded, or a milestone released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '409':
          description: Unified seats are incomplete, the per-seat target is not ready, or escrow is frozen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/{taskId}/dispute:
    post:
      tags: [Tasks, Escrow]
      summary: Open dispute (freeze escrow)
      description: |
        Exclusive, competitive, and unified disputes freeze the whole remaining hold and set status to disputed.
        per_seat freezes only the named submitted seat (role_id; required when more than one seat is submitted) and leaves other seats confirmable.
        Confirm and auto-settle stay blocked on the frozen amount. Close the dispute with resolve or arbitrate.
      operationId: disputeTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                role_id:
                  type: string
                  description: Required for per_seat when more than one seat is submitted. Freezes that seat's share only.
      responses:
        '200':
          description: Disputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}/cancel:
    post:
      tags: [Tasks, Escrow]
      summary: Cancel a task or unfinished per-seat work
      operationId: cancelTask
      description: |
        Publisher only. draft and open always cancel; open refunds the whole hold.
        active with no submission in the task's history refunds the whole hold. Executors get 0 commission and 0 ability.
        active per_seat with submissions refunds only open and filled-but-not-submitted seats. Submitted seats return 409.
        If every seat is then terminal and at least one was settled, the task is settled; if none were settled, it is cancelled.
        active unified or exclusive or competitive once any submission exists, in_review, disputed, settled, and cancelled return 409.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Cancelled, or per-seat unfinished seats refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '403':
          description: Not the publisher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Work is in review, disputed, or a submitted seat cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/{taskId}/revise:
    post:
      tags: [Tasks]
      summary: Ask the executor to revise a submission
      operationId: reviseTask
      description: |
        Publisher only, while a submission is awaiting review. The submission stays in history with status superseded.
        The seat or exclusive task returns to active and review_deadline is cleared until the next submit.
        Competitive revises one submission at a time; omit submission_id only when exactly one current submission exists.
        per_seat requires role_id when more than one seat is submitted.
        acceptance.max_revisions (default 3) is counted per exclusive task, per competitive author, and per collaborative seat.
        Past the limit the error is `revision limit reached; confirm or dispute`.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                role_id: { type: string }
                submission_id: { type: string }
      responses:
        '200':
          description: Revision requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '409':
          description: Not awaiting review, or the revision limit was reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/{taskId}/resolve:
    post:
      tags: [Tasks, Escrow]
      summary: Propose or accept a mutual dispute resolution
      operationId: resolveTask
      description: |
        Publisher or a current executor. For a per_seat dispute, the executor must hold the disputed seat.
        The first call stores a proposal (task.resolve_proposed). The other side must call again with the same outcome and, for split, the same splits.
        A different outcome replaces that side's proposal and clears the other side's agreement.
        pay_executor releases the frozen amount under the original rule. Competitive pay_executor requires submission_id and does not guess a winner.
        Unified pay splits by seat share_bps. per_seat pays that seat's share to its executor.
        refund_publisher returns the frozen amount to the publisher and, for a task-level dispute, sets status cancelled.
        split amounts must sum to the frozen amount, or share_bps must sum to 10000.
        Agreement unfreezes first, then releases or refunds.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resolution'
      responses:
        '200':
          description: Proposal stored, or outcome applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}/arbitrate:
    post:
      tags: [Tasks, Escrow]
      summary: Arbiter decides a dispute immediately
      operationId: arbitrateTask
      description: |
        Caller must be in Escrow.ArbiterUserIds (dev config includes usr_arbiter, X-Api-Key dev-arbiter-key, or `make token USER_ID=usr_arbiter`).
        Publisher and executor are not arbiters. Same money outcomes as resolve, applied in one call. reason is required.
        Emits task.arbitrated, escrow.unfreeze, and escrow.release or escrow.refund. task.settled when a payout closes the task; task.cancelled when a task-level refund does.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resolution'
      responses:
        '200':
          description: Outcome applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '403':
          description: Caller is not an arbiter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/{taskId}/invites:
    get:
      tags: [Tasks]
      summary: List invites on a task
      operationId: listTaskInvites
      description: The publisher sees every invite. An invitee sees only their own.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
    post:
      tags: [Tasks]
      summary: Invite more users
      operationId: createTaskInvites
      description: |
        Publisher only, while the task still has open capacity (exclusive open, competitive free slots, or a collaborative open seat, including a seat reopened by dropout).
        For specific policy the ids are appended to assignee_policy.user_ids. Emits task.invited.
        A declined invite can be re-opened by inviting that user again.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Invites on the task after the call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
  /tasks/{taskId}/dropout:
    post:
      tags: [Tasks]
      summary: Collaborative executor dropout (0 commission; seat reopenable)
      operationId: dropoutTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Dropped out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /friends:
    get:
      tags: [Friends]
      summary: Caller's friends, grouped
      operationId: listFriends
      description: |
        Only the authenticated owner. Groups are that owner's personal folders, including empty ones.
        ungrouped holds friends with no folder. The other person does not see these folders.
        Each friend has user_id, integrity, ability, and since. Email and secrets are omitted.
      responses:
        '200':
          description: Grouped friend list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendList'
  /friends/requests:
    post:
      tags: [Friends]
      summary: Send a friend request, or accept the reverse pending request
      operationId: createFriendRequest
      description: |
        Mutual friendship, not a follow. user_id must be an existing user and must not be the caller.
        Already friends, or a pending request the caller already sent, is 409 conflict and does not insert a second row.
        If the other user already has a pending request toward the caller, this accepts that request and returns 200 with status accepted.
        A newly created pending request returns 201 and emits friend.requested to the recipient's webhook subscriptions.
        Accepting the reverse request emits friend.accepted to the original requester.
        Caps: 100 pending outgoing requests. The 500-friend cap is enforced when the friendship is created.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFriendRequest'
      responses:
        '201':
          description: Pending request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '200':
          description: The other user's pending request was accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '409':
          description: Already friends, or the caller already has a pending request to that user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /friends/{userId}:
    delete:
      tags: [Friends]
      summary: Unfriend
      operationId: unfriend
      description: |
        Ends the friendship for both users and clears both users' group membership for the pair.
        A later request is allowed. Emits friend.removed to the other user's webhook subscriptions.
        data.user_id is the caller. data.friend_user_id is the person who was removed.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemovedFriend'
        '404':
          description: Not friends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /friends/{userId}/group:
    put:
      tags: [Friends]
      summary: Move a friend into a personal group, or ungroup them
      operationId: setFriendGroup
      description: |
        group_id null, or omitting the field, puts the friend in the ungrouped bucket.
        An empty string is 400. A missing group, or a group owned by someone else, is 404.
        A user who is not a friend is 404.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFriendGroup'
      responses:
        '200':
          description: Updated placement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendPlacement'
  /friend-requests:
    get:
      tags: [Friends]
      summary: Pending friend requests
      operationId: listFriendRequests
      description: direction is required. Only pending requests are returned.
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [incoming, outgoing] }
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestList'
  /friend-requests/{requestId}/accept:
    post:
      tags: [Friends]
      summary: Accept an incoming friend request
      operationId: acceptFriendRequest
      description: |
        Recipient only, and only while pending. Both users then see each other as friends.
        Emits friend.accepted to the requester. 500 friends per user is the cap.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, pattern: '^frq_' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
  /friend-requests/{requestId}/decline:
    post:
      tags: [Friends]
      summary: Decline an incoming friend request
      operationId: declineFriendRequest
      description: Recipient only, and only while pending. Emits friend.declined to the requester. A later request is allowed.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, pattern: '^frq_' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
  /friend-requests/{requestId}:
    delete:
      tags: [Friends]
      summary: Cancel an outgoing friend request
      operationId: cancelFriendRequest
      description: Requester only, and only while pending. Does not emit a webhook. A later request is allowed.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, pattern: '^frq_' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
  /friend-groups:
    get:
      tags: [Friends]
      summary: Caller's friend groups
      operationId: listFriendGroups
      description: Folders only, without members. GET /friends nests the members. At most 50 groups per user.
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendGroupList'
    post:
      tags: [Friends]
      summary: Create a friend group
      operationId: createFriendGroup
      description: |
        Name is trimmed. 1–32 characters, unique per owner. sort_order defaults to the current count (appended).
        The 51st group is 409 friend group limit reached.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFriendGroup'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendGroup'
  /friend-groups/{groupId}:
    patch:
      tags: [Friends]
      summary: Rename or reorder a friend group
      operationId: updateFriendGroup
      description: Send name, sort_order, or both. A group the caller does not own is 404. sort_order is an integer from -1000000 to 1000000.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, pattern: '^fgp_' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchFriendGroup'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendGroup'
    delete:
      tags: [Friends]
      summary: Delete a friend group
      operationId: deleteFriendGroup
      description: Friends in the folder become ungrouped. They stay friends. A group the caller does not own is 404.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, pattern: '^fgp_' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendGroup'
  /webhooks:
    post:
      tags: [Webhooks]
      summary: Register webhook endpoint
      operationId: createWebhook
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
  /me/invites:
    get:
      tags: [Users]
      summary: Invitations for the caller
      operationId: listMyInvites
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, declined] }
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
  /invites/{inviteId}/decline:
    post:
      tags: [Tasks]
      summary: Decline an invitation
      operationId: declineInvite
      description: |
        Invitee only. Emits task.invite_declined. A declined specific invite cannot accept until invited again.
        Accepting the task is how an invitee accepts; there is no separate accept-invite route.
      parameters:
        - name: inviteId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
  /chats:
    get:
      tags: [Chats]
      summary: Task chats visible to the caller
      operationId: listChats
      description: |
        Requires task_id. The publisher sees the bound chat. A member sees it. Anyone else receives 403 when a chat exists.
        Every item has type=task. Direct chats are not listed here; look them up with POST /chats {type: direct, user_id}.
      parameters:
        - name: task_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Chats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatList'
    post:
      tags: [Chats]
      summary: Create or reuse a chat
      operationId: createChat
      description: |
        Two shapes, both 201.

        Direct: `{ "type": "direct", "user_id": "usr_…" }`. The caller and user_id must already be friends.
        A pending request, a stranger, or yourself is rejected (403 for a non-friend, 400 for yourself or a bad id).
        The pair is stored once (user ids ordered, unique). The first call inserts the chat and emits chat.created
        to both members. A later call, from either person, returns that same chat and does not emit again.
        member_ids and task_id are rejected on this shape.

        Group: omit type, or send type=group, with member_ids. The caller is added. Each call inserts a new row.
        Optional task_id reuses the chat already bound to that task instead of creating a second one.
        The caller must be the publisher or an executor. Fund still creates a chat if none exists.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreate'
      responses:
        '201':
          description: |
            Created, or the existing direct chat for this pair. The HTTP status stays 201 so an
            Idempotency-Key replay matches the first response. Identity is the chat id, not the status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '403':
          description: Not friends, or not allowed to bind the task chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /chats/{chatId}:
    get:
      tags: [Chats]
      summary: Chat metadata
      operationId: getChat
      description: |
        Members only. type is task, direct, or group. task_id is set only when type is task.
        Unfriend does not remove direct-chat members, so this read stays allowed.
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '403':
          description: Not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /chats/{chatId}/messages:
    get:
      tags: [Chats]
      summary: Message history
      operationId: listMessages
      description: |
        Members only. Pages are oldest-to-newest. cursor continues forward in that same order.
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Message page, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '403':
          description: Not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Chats]
      summary: Send message
      operationId: postMessage
      description: |
        Members only. Unfriend does not remove direct-chat members, so a former friend can still send.
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /users/{userId}/scores:
    get:
      tags: [Users]
      summary: Integrity and ability scores
      operationId: getUserScores
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserScores'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, pattern: '^tsk_' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    PasswordCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8 to 72 bytes. Stored as a bcrypt hash, never as plaintext.
    AuthSession:
      type: object
      required: [access_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: HS256 JWT. `sub` is the user id. `iat` and `exp` match `make token`.
        expires_in:
          type: integer
          minimum: 1
          description: Token lifetime in seconds.
        user:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          description: User id. Password accounts use the `usr_` prefix.
        email:
          type: string
          description: Empty when the caller has no password account.
        is_arbiter:
          type: boolean
          description: True when the caller is listed in Escrow.ArbiterUserIds.
    TaskKind:
      type: string
      enum: [exclusive, competitive, collaborative]
    TaskStatus:
      type: string
      enum: [draft, open, active, in_review, disputed, settled, cancelled]
    PaymentMode:
      type: string
      enum: [one_shot, milestone]
    AssigneePolicyType:
      type: string
      enum: [specific, criteria, open]
    EscrowEntryType:
      type: string
      enum: [hold, release, refund, freeze, unfreeze]
    WebhookEventType:
      type: string
      enum:
        - task.funded
        - task.accepted
        - task.started
        - task.submitted
        - task.in_review
        - task.confirmed
        - task.auto_settled
        - task.disputed
        - task.settled
        - task.cancelled
        - task.executor_replaced
        - task.revision_requested
        - task.resolve_proposed
        - task.arbitrated
        - task.invited
        - task.invite_declined
        - escrow.hold
        - escrow.release
        - escrow.refund
        - escrow.unfreeze
        - chat.created
        - chat.message.created
        - score.updated
        - friend.requested
        - friend.accepted
        - friend.declined
        - friend.removed
    MoneyAmount:
      type: integer
      minimum: 0
      description: Simulated credits (smallest unit)
    Milestone:
      type: object
      required: [id, amount, condition]
      properties:
        id: { type: string }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        condition: { type: string }
        status:
          type: string
          enum: [pending, submitted, released, disputed]
    AssigneePolicy:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/AssigneePolicyType' }
        user_ids:
          type: array
          items: { type: string }
        min_ability: { type: integer }
    CollaborativeRole:
      type: object
      description: |
        On create, one role template. On a task resource, one materialized seat.
        share_bps is the template total on create: role totals must sum to 10000, and quantity does not multiply that number.
        The server stores quantity seats (default 1). Each seat gets floor(share_bps / quantity), then the last
        (share_bps mod quantity) seats each get one extra basis point so the seats sum to the template total.
        Task responses omit quantity. share_bps on a returned seat is that seat's share after the split.
        Those seat shares still sum to 10000 and are what settlement uses.
      required: [id, name, share_bps]
      properties:
        id:
          type: string
          description: |
            Template id on create. Seat id on the task.
            quantity 1, or omitted, keeps this id.
            quantity N materializes `{id}_1` through `{id}_N` (1-based).
            accept and dropout send the seat id.
        name: { type: string }
        quantity:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
          description: |
            Create input only. Seats to materialize from this template. Omitted means 1.
            Not returned on task seats. Does not multiply share_bps.
        share_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: |
            share_bps is the template total on create, not the per-seat figure.
            Across templates these totals must sum to 10000.
            On the task resource this is the seat's own share after the server split.
        template_id:
          type: string
          description: |
            Present on materialized seats. The template id from create. Ignored on create.
        assignee_user_id:
          type: [string, 'null']
        status:
          type: string
          description: |
            Server-assigned on a task. submitted means that seat's delivery is awaiting confirm.
            settled means that seat's share was released to its executor.
            refunded means that share was returned to the publisher.
            Dropout replace sets the seat back to open. It does not stay dropped.
            disputed means a per_seat dispute froze this seat's share. refund_deadline is when an open per_seat seat auto-refunds.
          enum: [open, filled, dropped, submitted, settled, refunded, disputed]
        refund_deadline:
          type: [string, 'null']
          format: date-time
          description: Present on an open per_seat seat. min(opened_at + SeatTimeout, acceptance.deadline).
    TaskCreate:
      type: object
      required: [kind, title, description, payment, acceptance, assignee_policy]
      properties:
        kind: { $ref: '#/components/schemas/TaskKind' }
        title: { type: string }
        description: { type: string }
        payment:
          type: object
          required: [mode, amount]
          properties:
            mode: { $ref: '#/components/schemas/PaymentMode' }
            amount: { $ref: '#/components/schemas/MoneyAmount' }
            milestones:
              type: array
              items: { $ref: '#/components/schemas/Milestone' }
            conditions:
              type: array
              items:
                type: string
                enum: [on_accept, on_milestone_pass, on_final_confirm]
        acceptance:
          type: object
          required: [deadline, quality]
          properties:
            deadline: { type: string, format: date-time }
            quality: { type: string }
            constraints:
              type: array
              items: { type: string }
            review_hours:
              type: integer
              default: 72
            max_revisions:
              type: integer
              minimum: 1
              maximum: 20
              default: 3
              description: How many times the publisher may request revision. Omitted means 3.
        assignee_policy: { $ref: '#/components/schemas/AssigneePolicy' }
        competitive:
          type: object
          properties:
            slots: { type: integer, minimum: 2 }
            settlement_rule:
              type: string
              enum: [winner_take_all]
              default: winner_take_all
        collaborative:
          type: object
          description: |
            Required when kind is collaborative. v0.1 collaborative tasks use payment.mode one_shot.
            Seat shares are parts of that single escrow pool. on_dropout stays replace.
            quantity and share_bps rules are unchanged.
          properties:
            settlement_mode:
              type: string
              enum: [per_seat, unified]
              default: unified
              description: |
                Chosen at create time. Omitted means unified, including tasks stored before this field existed.
                unified fills seats while open, then the publisher starts the task, then one confirm splits the pool.
                per_seat lets each filled seat submit and settle on its own for that seat's share_bps.
            roles:
              type: array
              description: |
                Create: 1 to 20 role templates. The server expands them and stores at most 20 seats.
                Task responses: those seats. Accept and dropout use each seat's id.
              items: { $ref: '#/components/schemas/CollaborativeRole' }
            on_dropout:
              type: string
              enum: [replace]
              default: replace
              description: |
                Dropout reopens the same seat. The exitee gets 0 commission and 0 ability.
                Before a unified start the task stays open. After start the task stays active even if a seat is open again.
    Task:
      allOf:
        - $ref: '#/components/schemas/TaskCreate'
        - type: object
          required: [id, status, publisher_id, created_at]
          properties:
            id: { type: string }
            status: { $ref: '#/components/schemas/TaskStatus' }
            publisher_id: { type: string }
            executor_ids:
              type: array
              items: { type: string }
            winning_submission_id: { type: [string, 'null'] }
            review_deadline: { type: [string, 'null'], format: date-time }
            open_deadline:
              type: [string, 'null']
              format: date-time
              description: When an open exclusive, unaccepted competitive, or not-yet-full unified task auto-cancels.
            start_deadline:
              type: [string, 'null']
              format: date-time
              description: When a fully seated unified task still waiting for start auto-cancels.
            winner_select_deadline:
              type: [string, 'null']
              format: date-time
              description: When a competitive task with more than one current submission refunds if no winner is confirmed.
            chat_id: { type: [string, 'null'] }
            cancel_reason: { type: [string, 'null'] }
            cancel_code:
              type: [string, 'null']
              description: Machine reason when a timeout cancelled the task. open_timeout, start_timeout, or winner_select_timeout.
            cancelled_at: { type: [string, 'null'], format: date-time }
            dispute_role_id:
              type: [string, 'null']
              description: Set while a per_seat dispute freezes one seat. Empty for a task-level freeze.
            resolve_proposals:
              type: array
              items: { $ref: '#/components/schemas/ResolveProposal' }
            submissions:
              type: array
              description: Current and superseded deliveries, oldest first. Clients pick a competitive winner from this list.
              items: { $ref: '#/components/schemas/Submission' }
            escrow:
              $ref: '#/components/schemas/EscrowAccount'
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        next_cursor: { type: [string, 'null'] }
    SubmissionCreate:
      type: object
      required: [payload]
      properties:
        milestone_id: { type: string }
        payload:
          type: object
          additionalProperties: true
        note: { type: string }
    Submission:
      type: object
      required: [id, executor_id, payload, status, created_at]
      properties:
        id: { type: string }
        executor_id: { type: string }
        role_id: { type: [string, 'null'] }
        milestone_id: { type: [string, 'null'] }
        payload:
          type: object
          additionalProperties: true
        note: { type: string }
        status:
          type: string
          enum: [current, superseded]
        created_at: { type: string, format: date-time }
    SplitLine:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        share_bps: { type: integer, minimum: 0, maximum: 10000 }
    Resolution:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [pay_executor, refund_publisher, split]
        reason: { type: string }
        role_id: { type: string }
        submission_id: { type: string }
        splits:
          type: array
          items: { $ref: '#/components/schemas/SplitLine' }
    ResolveProposal:
      type: object
      required: [user_id, side, outcome, created_at]
      properties:
        user_id: { type: string }
        side: { type: string, enum: [publisher, executor] }
        outcome: { type: string, enum: [pay_executor, refund_publisher, split] }
        reason: { type: string }
        role_id: { type: string }
        submission_id: { type: string }
        splits:
          type: array
          items: { $ref: '#/components/schemas/SplitLine' }
        created_at: { type: string, format: date-time }
    Invite:
      type: object
      required: [id, task_id, user_id, status, created_at, updated_at]
      properties:
        id: { type: string }
        task_id: { type: string }
        user_id: { type: string }
        status: { type: string, enum: [pending, accepted, declined] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invite' }
    ChatList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Chat' }
    MessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        next_cursor: { type: [string, 'null'] }
    EscrowAccount:
      type: object
      properties:
        id: { type: string }
        held: { $ref: '#/components/schemas/MoneyAmount' }
        frozen:
          type: integer
          minimum: 0
          description: Amount locked by an open dispute. Per-seat disputes freeze only that seat's share.
        currency:
          type: string
          default: credits
        entries:
          type: array
          items: { $ref: '#/components/schemas/EscrowEntry' }
    EscrowEntry:
      type: object
      required: [id, type, amount, created_at]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/EscrowEntryType' }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        to_user_id: { type: string }
        created_at: { type: string, format: date-time }
    WebhookCreate:
      type: object
      required: [url, secret, events]
      properties:
        url: { type: string, format: uri }
        secret: { type: string, minLength: 16 }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
    Webhook:
      allOf:
        - $ref: '#/components/schemas/WebhookCreate'
        - type: object
          required: [id, created_at]
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }
    WebhookEnvelope:
      type: object
      description: |
        Delivered as HTTP POST to the registered URL.
        Headers: X-Signature = HMAC-SHA256(raw_body, secret); X-Event-Id for idempotency.
      required: [id, type, created_at, data]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/WebhookEventType' }
        created_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
    ChatType:
      type: string
      enum: [task, direct, group]
      description: |
        task is the thread funding binds to a task. direct is the one 1:1 thread for a friend pair.
        group is a free-form member_ids chat, and each create inserts a new row.
    ChatCreate:
      type: object
      description: |
        Direct uses type=direct and user_id. Group uses member_ids and may set task_id.
        Do not send both shapes in one body.
      properties:
        type:
          type: string
          enum: [direct, group]
          description: Omit for the historical group chat.
        user_id:
          type: string
          description: The other user. Required when type is direct. Must already be a friend.
        member_ids:
          type: array
          items: { type: string }
          description: Required for a group chat. The caller is added. Not used for direct.
        task_id:
          type: string
          description: |
            Optional on a group chat. Reuses the chat already bound to that task.
            The caller must be the publisher or an executor.
    Chat:
      type: object
      required: [id, type, member_ids]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/ChatType' }
        task_id:
          type: [string, 'null']
          description: Set when type is task. Absent for direct and group.
        member_ids:
          type: array
          items: { type: string }
          description: For a direct chat, the two user ids in ascending order.
    MessageCreate:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, attachment_ref]
        text: { type: string }
        attachment_ref: { type: string }
    Message:
      allOf:
        - $ref: '#/components/schemas/MessageCreate'
        - type: object
          required: [id, chat_id, sender_id, created_at]
          properties:
            id: { type: string }
            chat_id: { type: string }
            sender_id: { type: string }
            created_at: { type: string, format: date-time }
    UserScores:
      type: object
      required: [user_id, integrity, ability]
      properties:
        user_id: { type: string }
        integrity: { type: integer }
        ability: { type: integer }
        recent:
          type: array
          items:
            type: object
            properties:
              delta_integrity: { type: integer }
              delta_ability: { type: integer }
              reason: { type: string }
              task_id: { type: string }
              created_at: { type: string, format: date-time }
    Friend:
      type: object
      description: |
        Public friend card. integrity and ability match GET /users/{userId}/scores.
        Email, balance, and password are not included.
      required: [user_id, integrity, ability, since]
      properties:
        user_id: { type: string }
        integrity: { type: integer }
        ability: { type: integer }
        since:
          type: string
          format: date-time
          description: When the friendship was accepted.
    FriendGroup:
      type: object
      required: [id, name, sort_order]
      properties:
        id: { type: string, pattern: '^fgp_' }
        name: { type: string, minLength: 1, maxLength: 32 }
        sort_order: { type: integer, minimum: -1000000, maximum: 1000000 }
    FriendGroupWithFriends:
      type: object
      required: [id, name, sort_order, friends]
      properties:
        id: { type: string }
        name: { type: string }
        sort_order: { type: integer }
        friends:
          type: array
          items: { $ref: '#/components/schemas/Friend' }
    FriendList:
      type: object
      required: [groups, ungrouped]
      properties:
        groups:
          type: array
          description: The caller's folders, including empty ones, ordered by sort_order, then created time.
          items: { $ref: '#/components/schemas/FriendGroupWithFriends' }
        ungrouped:
          type: array
          items: { $ref: '#/components/schemas/Friend' }
    FriendRequest:
      type: object
      required: [id, from_user_id, to_user_id, status, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^frq_' }
        from_user_id: { type: string }
        to_user_id: { type: string }
        status:
          type: string
          enum: [pending, accepted, declined, cancelled]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FriendRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FriendRequest' }
    FriendGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FriendGroup' }
    RemovedFriend:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, description: The user who is no longer a friend. }
    FriendPlacement:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
        group_id:
          type: [string, 'null']
          description: null when the friend is in the ungrouped bucket.
    CreateFriendRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
    CreateFriendGroup:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Trimmed. 1–32 characters. Unique per owner.
    PatchFriendGroup:
      type: object
      description: At least one of name or sort_order is required.
      properties:
        name: { type: string }
        sort_order: { type: integer, minimum: -1000000, maximum: 1000000 }
    SetFriendGroup:
      type: object
      properties:
        group_id:
          type: [string, 'null']
          description: |
            A group id the caller owns. null, or omitting the field, moves the friend to the ungrouped bucket.
            An empty string is 400. A group the caller does not own is 404. A user who is not a friend is 404.
