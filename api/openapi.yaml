openapi: 3.1.0
info:
  title: Task Game Open Protocol
  version: 0.1.0
  summary: Multiplayer shared-task marketplace API (simulated escrow first)
  description: |
    Locked assumptions (v0.1):
    - Simulated escrow (credits); real money later without changing task FSM
    - Acceptance: executor submit → publisher confirm; default 72h auto-settle; dispute freezes funds
    - Task kinds: exclusive | competitive | collaborative
    - competitive.settlement_rule = winner_take_all
    - collaborative.on_dropout = replace (dropout gets 0 commission, 0 ability score)
    - Additive in v0.1: collaborative roles take optional quantity (default 1). share_bps is the template total and those totals still sum to 10000. The server materializes that many seats and splits the share (extra basis points go to the last seats of that template). Task responses list seats, not templates. Accept uses the seat id. A flat roles[] array with no quantity is unchanged.
    - collaborative.settlement_mode = per_seat | unified, default unified. Omitting the field means unified, including tasks stored before the field existed. Collaborative tasks use payment.mode one_shot in v0.1 so seat shares apply to one escrow pool.
      unified: executors may fill seats while the task is open. Work does not start, and status does not become active, until the publisher calls POST /tasks/{taskId}/start and every seat is filled. Confirm is all-or-nothing: it fails until every current seat has submitted and no seat is open, then one settlement splits the whole pool by seat share_bps. After start, dropout replace still reopens that seat and the task stays active. Confirm stays blocked until the seat is filled again and every current seat has submitted.
      per_seat: each executor accepts an open seat after fund. That seat can submit and be confirmed on its own. POST /tasks/{taskId}/confirm with role_id releases only that seat's share_bps of the original pool (escrow.release) and leaves the rest held. An open seat is not paid; confirming it refunds that share to the publisher. The task is settled only when every seat is settled or refunded. v0.1 auto-settle for per_seat runs only after every non-terminal seat has submitted and the review window has passed. Confirm earlier seats manually. Ability and commission for an executor apply when that seat is paid; unified still applies them in one batch on confirm.
    - API / Webhook first; no UI required for third parties
    - Additive in v0.1: POST /register and POST /login are public. They store a bcrypt password hash (never plaintext) and return an HS256 access token with the same claims as `make token` (`sub` is the user id, plus `iat` and `exp`). X-Api-Key dev users such as usr_publisher and usr_executor stay valid. GET /me returns the caller id and email.
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: Auth
  - name: Tasks
  - name: Escrow
  - name: Webhooks
  - name: Chats
  - name: Users
paths:
  /register:
    post:
      tags: [Auth]
      summary: Register with email and password
      operationId: register
      security: []
      description: |
        Public. Creates a user id (`usr_` plus random) and stores a bcrypt password hash.
        The access token is an HS256 JWT whose `sub` is that user id (same shape as `make token`).
        Invalid email or password is 400 `invalid_argument`. A duplicate email is 409 `conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordCredentials'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: login
      security: []
      description: |
        Public. Returns a new HS256 access token (`sub` is the user id).
        Unknown email and wrong password are both 401 `unauthorized` with the same message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordCredentials'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unknown email or wrong password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me:
    get:
      tags: [Auth, Users]
      summary: Current caller
      operationId: me
      description: |
        Requires Bearer or X-Api-Key. Email is empty when the caller has no password account
        (development API keys).
      responses:
        '200':
          description: Caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks:
    get:
      tags: [Tasks]
      summary: List / filter tasks
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/TaskKind'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Task page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
    post:
      tags: [Tasks]
      summary: Create task (draft)
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get task
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}/fund:
    post:
      tags: [Tasks, Escrow]
      summary: Simulate escrow hold → status open
      operationId: fundTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Funded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}/accept:
    post:
      tags: [Tasks]
      summary: Executor accepts an open task or an open collaborative seat
      operationId: acceptTask
      description: |
        Exclusive moves open to active. Competitive fills a slot and is active once the first executor accepts.
        Collaborative unified fills one seat and leaves the task open until POST /tasks/{taskId}/start.
        After that start, accept only fills a seat reopened by dropout, and the task stays active.
        Collaborative per_seat fills one seat. The first filled seat moves the task to active so that seat can submit without the others.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role_id:
                  type: string
                  description: |
                    Required for a collaborative task. This is a materialized seat id.
                    quantity 1 keeps the template id. quantity N uses `{id}_1` through `{id}_N`.
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}/start:
    post:
      tags: [Tasks]
      summary: Start a unified collaborative task once every seat is filled
      operationId: startTask
      description: |
        Publisher only. Valid when collaborative.settlement_mode is unified, including tasks created without the field.
        Status must be open, and every materialized seat must be filled.
        The task then becomes active. Executors cannot submit before this call.
        per_seat tasks do not use start. A filled seat submits while the task is active.
        Emits task.started. Subscribers opt in by listing that event.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '403':
          description: Caller is not the publisher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Not a unified open task, or a seat is still open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/{taskId}/submit:
    post:
      tags: [Tasks]
      summary: Submit delivery → in_review
      operationId: submitTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}/confirm:
    post:
      tags: [Tasks, Escrow]
      summary: Publisher confirms delivery and releases escrow
      operationId: confirmTask
      description: |
        Exclusive and competitive tasks must be in_review. Competitive winner_take_all pays the submission_id you choose.
        Milestone mode releases one milestone and returns the task to active until the last milestone.

        Collaborative unified (the default): confirm fails until the publisher has started the task, every seat is filled, and every filled seat has submitted.
        One confirm then splits the whole pool by seat share_bps. After start, dropout replace reopens that seat and the task stays active.
        Confirm keeps failing until that seat is filled and every current seat has submitted.
        The failure names the open seats (`unified settlement requires every seat to be filled; open: ...`) or the seats that have not submitted (`unified settlement requires a submission from every filled seat; missing: ...`).

        Collaborative per_seat: confirm one seat. role_id is that seat id.
        A submitted seat releases that seat's share of the original escrow pool to its executor and leaves the rest held.
        An open seat refunds that share to the publisher and pays nobody. A filled seat that has not submitted is rejected (`seat has not submitted`).
        Omit role_id only when exactly one seat is awaiting confirmation, or when every remaining seat is open (those shares are refunded together).
        When more than one seat is awaiting confirmation the error is `role_id is required when multiple seats are awaiting confirmation: ...`.
        The task stays active while any seat is still open or filled. It becomes settled only when every seat is settled or refunded.
        v0.1 does not auto-settle a per_seat task until every non-terminal seat has submitted and review_deadline has passed. Confirm earlier seats manually.
        role_id is rejected unless settlement_mode is per_seat.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                submission_id:
                  type: string
                  description: Required for competitive when more than one submission exists. Optional on per_seat; it must match that seat's submission.
                milestone_id:
                  type: string
                role_id:
                  type: string
                  description: |
                    Seat id. Used when settlement_mode is per_seat.
                    Confirms that one submitted seat, or refunds that one open seat.
      responses:
        '200':
          description: Settled, one seat released or refunded, or a milestone released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '409':
          description: Unified seats are incomplete, the per-seat target is not ready, or escrow is frozen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/{taskId}/dispute:
    post:
      tags: [Tasks, Escrow]
      summary: Open dispute (freeze escrow)
      operationId: disputeTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Disputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{taskId}/dropout:
    post:
      tags: [Tasks]
      summary: Collaborative executor dropout (0 commission; seat reopenable)
      operationId: dropoutTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Dropped out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /webhooks:
    post:
      tags: [Webhooks]
      summary: Register webhook endpoint
      operationId: createWebhook
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
  /chats:
    post:
      tags: [Chats]
      summary: Create free-form chat
      operationId: createChat
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_ids]
              properties:
                member_ids:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
  /chats/{chatId}/messages:
    post:
      tags: [Chats]
      summary: Send message
      operationId: postMessage
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /users/{userId}/scores:
    get:
      tags: [Users]
      summary: Integrity and ability scores
      operationId: getUserScores
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserScores'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, pattern: '^tsk_' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    PasswordCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8 to 72 bytes. Stored as a bcrypt hash, never as plaintext.
    AuthSession:
      type: object
      required: [access_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: HS256 JWT. `sub` is the user id. `iat` and `exp` match `make token`.
        expires_in:
          type: integer
          minimum: 1
          description: Token lifetime in seconds.
        user:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          description: User id. Password accounts use the `usr_` prefix.
        email:
          type: string
          description: Empty when the caller has no password account.
    TaskKind:
      type: string
      enum: [exclusive, competitive, collaborative]
    TaskStatus:
      type: string
      enum: [draft, open, active, in_review, disputed, settled, cancelled]
    PaymentMode:
      type: string
      enum: [one_shot, milestone]
    AssigneePolicyType:
      type: string
      enum: [specific, criteria, open]
    EscrowEntryType:
      type: string
      enum: [hold, release, refund, freeze]
    WebhookEventType:
      type: string
      enum:
        - task.funded
        - task.accepted
        - task.started
        - task.submitted
        - task.in_review
        - task.confirmed
        - task.auto_settled
        - task.disputed
        - task.settled
        - task.cancelled
        - task.executor_replaced
        - escrow.hold
        - escrow.release
        - escrow.refund
        - chat.message.created
        - score.updated
    MoneyAmount:
      type: integer
      minimum: 0
      description: Simulated credits (smallest unit)
    Milestone:
      type: object
      required: [id, amount, condition]
      properties:
        id: { type: string }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        condition: { type: string }
        status:
          type: string
          enum: [pending, submitted, released, disputed]
    AssigneePolicy:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/AssigneePolicyType' }
        user_ids:
          type: array
          items: { type: string }
        min_ability: { type: integer }
    CollaborativeRole:
      type: object
      description: |
        On create, one role template. On a task resource, one materialized seat.
        share_bps is the template total on create: role totals must sum to 10000, and quantity does not multiply that number.
        The server stores quantity seats (default 1). Each seat gets floor(share_bps / quantity), then the last
        (share_bps mod quantity) seats each get one extra basis point so the seats sum to the template total.
        Task responses omit quantity. share_bps on a returned seat is that seat's share after the split.
        Those seat shares still sum to 10000 and are what settlement uses.
      required: [id, name, share_bps]
      properties:
        id:
          type: string
          description: |
            Template id on create. Seat id on the task.
            quantity 1, or omitted, keeps this id.
            quantity N materializes `{id}_1` through `{id}_N` (1-based).
            accept and dropout send the seat id.
        name: { type: string }
        quantity:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
          description: |
            Create input only. Seats to materialize from this template. Omitted means 1.
            Not returned on task seats. Does not multiply share_bps.
        share_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: |
            share_bps is the template total on create, not the per-seat figure.
            Across templates these totals must sum to 10000.
            On the task resource this is the seat's own share after the server split.
        template_id:
          type: string
          description: |
            Present on materialized seats. The template id from create. Ignored on create.
        assignee_user_id:
          type: [string, 'null']
        status:
          type: string
          description: |
            Server-assigned on a task. submitted means that seat's delivery is awaiting confirm.
            settled means that seat's share was released to its executor.
            refunded means that share was returned to the publisher.
            Dropout replace sets the seat back to open. It does not stay dropped.
          enum: [open, filled, dropped, submitted, settled, refunded]
    TaskCreate:
      type: object
      required: [kind, title, description, payment, acceptance, assignee_policy]
      properties:
        kind: { $ref: '#/components/schemas/TaskKind' }
        title: { type: string }
        description: { type: string }
        payment:
          type: object
          required: [mode, amount]
          properties:
            mode: { $ref: '#/components/schemas/PaymentMode' }
            amount: { $ref: '#/components/schemas/MoneyAmount' }
            milestones:
              type: array
              items: { $ref: '#/components/schemas/Milestone' }
            conditions:
              type: array
              items:
                type: string
                enum: [on_accept, on_milestone_pass, on_final_confirm]
        acceptance:
          type: object
          required: [deadline, quality]
          properties:
            deadline: { type: string, format: date-time }
            quality: { type: string }
            constraints:
              type: array
              items: { type: string }
            review_hours:
              type: integer
              default: 72
        assignee_policy: { $ref: '#/components/schemas/AssigneePolicy' }
        competitive:
          type: object
          properties:
            slots: { type: integer, minimum: 2 }
            settlement_rule:
              type: string
              enum: [winner_take_all]
              default: winner_take_all
        collaborative:
          type: object
          description: |
            Required when kind is collaborative. v0.1 collaborative tasks use payment.mode one_shot.
            Seat shares are parts of that single escrow pool. on_dropout stays replace.
            quantity and share_bps rules are unchanged.
          properties:
            settlement_mode:
              type: string
              enum: [per_seat, unified]
              default: unified
              description: |
                Chosen at create time. Omitted means unified, including tasks stored before this field existed.
                unified fills seats while open, then the publisher starts the task, then one confirm splits the pool.
                per_seat lets each filled seat submit and settle on its own for that seat's share_bps.
            roles:
              type: array
              description: |
                Create: 1 to 20 role templates. The server expands them and stores at most 20 seats.
                Task responses: those seats. Accept and dropout use each seat's id.
              items: { $ref: '#/components/schemas/CollaborativeRole' }
            on_dropout:
              type: string
              enum: [replace]
              default: replace
              description: |
                Dropout reopens the same seat. The exitee gets 0 commission and 0 ability.
                Before a unified start the task stays open. After start the task stays active even if a seat is open again.
    Task:
      allOf:
        - $ref: '#/components/schemas/TaskCreate'
        - type: object
          required: [id, status, publisher_id, created_at]
          properties:
            id: { type: string }
            status: { $ref: '#/components/schemas/TaskStatus' }
            publisher_id: { type: string }
            executor_ids:
              type: array
              items: { type: string }
            winning_submission_id: { type: [string, 'null'] }
            review_deadline: { type: [string, 'null'], format: date-time }
            escrow:
              $ref: '#/components/schemas/EscrowAccount'
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        next_cursor: { type: [string, 'null'] }
    SubmissionCreate:
      type: object
      required: [payload]
      properties:
        milestone_id: { type: string }
        payload:
          type: object
          additionalProperties: true
        note: { type: string }
    EscrowAccount:
      type: object
      properties:
        id: { type: string }
        held: { $ref: '#/components/schemas/MoneyAmount' }
        currency:
          type: string
          default: credits
        entries:
          type: array
          items: { $ref: '#/components/schemas/EscrowEntry' }
    EscrowEntry:
      type: object
      required: [id, type, amount, created_at]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/EscrowEntryType' }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        to_user_id: { type: string }
        created_at: { type: string, format: date-time }
    WebhookCreate:
      type: object
      required: [url, secret, events]
      properties:
        url: { type: string, format: uri }
        secret: { type: string, minLength: 16 }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
    Webhook:
      allOf:
        - $ref: '#/components/schemas/WebhookCreate'
        - type: object
          required: [id, created_at]
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }
    WebhookEnvelope:
      type: object
      description: |
        Delivered as HTTP POST to the registered URL.
        Headers: X-Signature = HMAC-SHA256(raw_body, secret); X-Event-Id for idempotency.
      required: [id, type, created_at, data]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/WebhookEventType' }
        created_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
    Chat:
      type: object
      required: [id, member_ids]
      properties:
        id: { type: string }
        task_id: { type: [string, 'null'] }
        member_ids:
          type: array
          items: { type: string }
    MessageCreate:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, attachment_ref]
        text: { type: string }
        attachment_ref: { type: string }
    Message:
      allOf:
        - $ref: '#/components/schemas/MessageCreate'
        - type: object
          required: [id, chat_id, sender_id, created_at]
          properties:
            id: { type: string }
            chat_id: { type: string }
            sender_id: { type: string }
            created_at: { type: string, format: date-time }
    UserScores:
      type: object
      required: [user_id, integrity, ability]
      properties:
        user_id: { type: string }
        integrity: { type: integer }
        ability: { type: integer }
        recent:
          type: array
          items:
            type: object
            properties:
              delta_integrity: { type: integer }
              delta_ability: { type: integer }
              reason: { type: string }
              task_id: { type: string }
              created_at: { type: string, format: date-time }
