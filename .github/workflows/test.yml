name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: taskgame
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The default config (etc/taskgame.yaml) enables message sharding, so the
      # smoke server needs the two shard schemas in addition to MYSQL_DATABASE.
      - name: create message shard databases
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq default-mysql-client
          fi
          mysql -h 127.0.0.1 -uroot -p123456 -e \
            "CREATE DATABASE IF NOT EXISTS taskgame_shard_0 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS taskgame_shard_1 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - name: unit and MySQL tests
        env:
          CGO_ENABLED: "0"
          TASKGAME_MYSQL_REQUIRED: "1"
          TASKGAME_MYSQL_DSN: root:123456@tcp(127.0.0.1:3306)/taskgame?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false
        run: go test ./...
      - name: smoke against MySQL
        env:
          CGO_ENABLED: "0"
        run: |
          go run . > /tmp/taskgame.log 2>&1 &
          echo $! > /tmp/taskgame.pid
          ok=0
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8891/health >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            cat /tmp/taskgame.log
            exit 1
          fi
          bash scripts/smoke.sh
          kill "$(cat /tmp/taskgame.pid)" || true
