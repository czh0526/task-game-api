name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The default config (etc/taskgame.yaml) is three independent cell
      # databases on 3307/3308/3309, each with the full schema.
      mysql-cell-0:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: taskgame
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      mysql-cell-1:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: taskgame
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      mysql-cell-2:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: taskgame
        ports:
          - 3309:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      # The default config turns on Scale.PubSub=redis, so the API requires
      # a reachable Redis even for the single-process smoke test.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: unit and MySQL tests
        env:
          CGO_ENABLED: "0"
          TASKGAME_MYSQL_REQUIRED: "1"
          # Tests create their own temporary schemas; cell 0 is a convenient
          # MySQL instance with CREATE DATABASE rights.
          TASKGAME_MYSQL_DSN: root:123456@tcp(127.0.0.1:3307)/taskgame?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=false
        run: go test ./...
      - name: smoke against the three cells
        env:
          CGO_ENABLED: "0"
        run: |
          go run . > /tmp/taskgame.log 2>&1 &
          echo $! > /tmp/taskgame.pid
          ok=0
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8891/health >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            cat /tmp/taskgame.log
            exit 1
          fi
          bash scripts/smoke.sh
          kill "$(cat /tmp/taskgame.pid)" || true
