# One MySQL instance per logical database: 1 primary + 2 message shards.
# Each instance owns exactly one schema, so the three databases can live on
# three different machines. Start with:
#   docker compose -f docker-compose.3instances.yml -p taskgame-3inst up -d
#   CGO_ENABLED=0 go run . -f etc/taskgame.mysql-3instances.yaml
# The project name is separate from the default docker-compose.yml so the
# existing 3306 container and its data are untouched.
services:
  db-primary:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: taskgame
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-shard-0:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: taskgame_shard_0
    ports:
      - "3308:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-shard-1:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: taskgame_shard_1
    ports:
      - "3309:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20
